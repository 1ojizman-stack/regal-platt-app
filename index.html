<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Regal Platt App v2</title>
    <!-- Подключаем официальный SDK Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Привязываем дизайн к системным цветам Telegram */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--tg-theme-text-color, #000000);
        }

        p {
            font-size: 16px;
            color: var(--tg-theme-hint-color, #707579);
        }

        .user-info {
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            text-align: left;
            word-break: break-all;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s ease;
        }

        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="greeting">Привет!</h1>
        <p>Добро пожаловать в Regal Platt App</p>
        
        <!-- Блок, куда выведутся данные пользователя -->
        <div class="user-info" id="user-data">
            Загрузка данных пользователя...
        </div>

        <button class="btn" id="main-action-btn">Выполнить действие</button>
        <button class="btn" style="background-color: #e53935;" id="close-btn">Закрыть приложение</button>
    </div>

    <script>
        // Инициализируем Telegram WebApp API
        const tg = window.Telegram.WebApp;

        // Сообщаем Telegram, что интерфейс готов к показу
        tg.ready();
        
        // Растягиваем приложение на всю доступную высоту экрана
        tg.expand();

        // Получаем информацию о пользователе из Telegram
        const user = tg.initDataUnsafe?.user;

        const greetingEl = document.getElementById('greeting');
        const userDataEl = document.getElementById('user-data');

        if (user) {
            // Если зашли через Telegram, персонализируем интерфейс
            greetingEl.textContent = `Привет, ${user.first_name}!`;
            userDataEl.innerHTML = `
                <strong>Твой ID:</strong> ${user.id}<br>
                <strong>Имя:</strong> ${user.first_name} ${user.last_name || ''}<br>
                <strong>Username:</strong> @${user.username || 'не указан'}<br>
                <strong>Язык:</strong> ${user.language_code}
            `;
        } else {
            // Если открыли просто в обычном браузере вне Telegram
            greetingEl.textContent = `Привет, Гость!`;
            userDataEl.innerHTML = `Режим просмотра вне Telegram. Данные недоступны.`;
        }

        // Кнопка основного действия (отправка данных боту)
        document.getElementById('main-action-btn').addEventListener('click', () => {
            const dataToSend = {
                status: "success",
                message: "Пользователь нажал кнопку действия",
                timestamp: Date.now()
            };
            
            // Отправляем данные обратно боту (работает, если запущено из инлайн-кнопки)
            tg.sendData(JSON.stringify(dataToSend));
            
            // Также покажем стандартное всплывающее окно внутри Telegram для теста
            tg.showAlert("Действие выполнено успешно!");
        });

        // Кнопка закрытия приложения
        document.getElementById('close-btn').addEventListener('click', () => {
            tg.close();
        });
    </script>
</body>
</html>
